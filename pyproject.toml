[tool.ruff]
line-length = 100
target-version = "py39"

select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # python upgrades
]

ignore = [
    "E501"
]

fix = true

exclude = [
    ".git",
    "__pycache__",
    "venv",
    "node_modules",
]

[tool.black]
line-length = 100
target-version = ["py39"]